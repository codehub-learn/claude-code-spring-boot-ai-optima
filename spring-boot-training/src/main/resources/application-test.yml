# Test profile. Loaded by any @SpringBootTest / slice test that sets @ActiveProfiles("test"), and by the
# Maven build in CI (the `ci` Maven profile sets spring-boot.run.profiles=test).

spring:
  main:
    # Tests do not need the ASCII banner in their output.
    banner-mode: off
  devtools:
    restart:
      enabled: false
  jpa:
    properties:
      # Keep test logs terse; SQL formatting is not what these tests assert.
      hibernate.format_sql: false
  flyway:
    # Re-enable Boot-managed Flyway for tests only. The datasource is a per-run Testcontainers
    # database, so `mvn flyway:migrate` (which targets compose.yaml Oracle) cannot prepare it -
    # Boot migrates it on context start instead. Production/dev boot keeps Flyway off (application.yml).
    enabled: true

logging:
  structured:
    format:
      # Keep test output readable; JSON assertions are not what these tests check.
      console:
  level:
    root: WARN
    gr.codelearn.springbootai.training: INFO

# Override the validated config with test-only values so binding is exercised without depending on
# application.yml staying put.
app:
  name: Training (test)
  catalog:
    default-page-size: 5
    max-page-size: 10
  cors:
    allowed-origins:
      - http://localhost
  foundation:
    # Short so SchedulingAndAsyncTest's heartbeat latch trips in milliseconds, not an hour.
    heartbeat-interval: 200ms
