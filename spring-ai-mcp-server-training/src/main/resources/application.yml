spring:
  application:
    name: spring-ai-mcp-server-training
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: training-tools
        version: "@project.version@"
        # Unit 11.4: a synchronous server (tools are plain blocking methods) speaking streamable HTTP, the current MCP HTTP transport.
        # STREAMABLE serves one endpoint (below); SSE is the older two-endpoint transport, STDIO is for a client that launches the process.
        type: SYNC
        protocol: STREAMABLE
        instructions: >-
          Tools for the Spring AI training. currentTime gives the time in a time zone, add sums two decimal numbers exactly,
          searchWikipedia looks facts up online.
        streamable-http:
          mcp-endpoint: /mcp
        annotation-scanner:
          # The tools are Spring AI @Tool methods (ToolsConfig). This turns off the scan for the MCP SDK's own @McpTool annotations, which
          # would only log "No tool methods found" at startup.
          enabled: false

server:
  # Not 8080: spring-ai-training (the MCP client) runs next to this server.
  port: 8090

# Application-owned settings, bound to validated records (tools.WikipediaProperties).
app:
  wikipedia:
    # The searchWikipedia tool: the MediaWiki site to search, without a path. Another language edition works too (https://el.wikipedia.org).
    base-url: https://en.wikipedia.org
    # Without timeouts a slow Wikipedia holds the MCP call, and the model's tool loop behind it, for as long as it likes.
    connect-timeout: 2s
    read-timeout: 5s
    # Articles per search. Each one adds up to ~500 characters of intro to what the model has to read.
    max-results: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      # Native Boot structured logging (ECS JSON); application-local.yml switches it off for readable local runs.
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: "@project.version@"
        environment: ${spring.profiles.active:default}
