# Local development profile. Activated by `./mvnw spring-boot:run` (the Maven `local` profile sets
# spring-boot.run.profiles=local) or by running with -Dspring.profiles.active=local from the IDE.
#
# This file is committed on purpose: it holds no secrets, only developer-ergonomics overrides. Real
# secrets (API keys, DB passwords) belong in a git-ignored .env or environment variables.

logging:
  structured:
    format:
      # Empty => disable the ECS JSON layout from application.yml and fall back to the readable console pattern.
      console:
  level:
    gr.codelearn.springbootai.ai: DEBUG
    # SimpleLoggerAdvisor logs full prompts and completions at DEBUG. Local only: they may contain user data (CLAUDE.md).
    org.springframework.ai.chat.client.advisor: DEBUG

management:
  endpoints:
    web:
      exposure:
        # Everything is fair game locally; non-local profiles stay locked down (see application.yml).
        include: "*"
  # Unit 10.4: export to the compose otel-lgtm service (`docker compose --profile observability up -d`, Grafana on :3000). Without it
  # running the app still works; the exporters log connection warnings.
  otlp:
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
        # Push every 10 s instead of 60 s, so a demo request shows up in Grafana quickly.
        step: 10s
  tracing:
    export:
      enabled: true
    sampling:
      # Trace every request locally.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

spring:
  devtools:
    restart:
      # Auto-restart on classpath change. LiveReload (browser refresh) is on by default on port 35729.
      enabled: true
    livereload:
      enabled: true

app:
  ai:
    # Unit 7.4: local development runs on the offline model (Ollama from compose.yaml, `--profile ai`). For the cloud model with the
    # same dev ergonomics, add the anthropic profile after this one: spring.profiles.active=local,anthropic (the last profile wins).
    chat-provider: ollama
  delivery:
    carrier:
      stub:
        # Unit 11.3: the application plays the carrier, and the postcode picks the behavior (see StubCarrierController): 50000 down,
        # 50001 fails once then works, 50002 rate limited, 50003 too slow, 40404 refused, anything else a quote.
        enabled: true