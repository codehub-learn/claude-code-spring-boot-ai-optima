spring:
  application:
    name: spring-ai-training
  threads:
    virtual:
      # Java 21+ virtual threads for request handling and @Async; keeps blocking code cheap under load.
      enabled: true
  datasource:
    # Unit 9.2: chat memory lives in Oracle, the compose instance spring-boot-training uses too, but in this module's own schema user
    # ai_training (created by compose/oracle-startdb). A throwaway local credential, like compose.yaml's; prod overrides with
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD. The app assumes the database is up and migrated (./mvnw -pl spring-ai-training
    # flyway:migrate); tests use Testcontainers instead.
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ai_training
    password: ai_training
    hikari:
      pool-name: ai-training-pool
      # Small pool: memory reads/writes are short, and no connection is held while the model answers (see ConversationService).
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    # Not applied on app boot: ./mvnw -pl spring-ai-training flyway:migrate (connection in the module pom). Only the test profile
    # turns Boot's Flyway on, for its throwaway Testcontainers database.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    jdbc:
      # Spring Data JDBC (the conversation registry): stated, not auto-detected from the driver on every start.
      dialect: oracle
  ai:
    model:
      # Unit 7.1: which provider's ChatModel bean is created. Both starters (Anthropic, Ollama) are on the classpath and each one's chat
      # autoconfig is active only when this names it; left unset, BOTH activate (matchIfMissing) and the ChatClient.Builder fails on
      # two ChatModel beans. Unit 7.4: never set it directly; it follows the validated app.ai.chat-provider (bottom of this file).
      chat: ${app.ai.chat-provider}
      # Unit 10.1: embeddings come from Ollama whichever chat provider is active (Anthropic has no embeddings API), so RAG needs the
      # Ollama server even under the anthropic profile. The model is spring.ai.ollama.embedding.model below.
      embedding: ollama
    retry:
      # Unit 7.4: Spring AI's RetryTemplate, used by the Ollama path only (Anthropic retries inside its own SDK, see max-retries below).
      # The defaults are 10 attempts with an uncapped 2 s x5 backoff: with Ollama down a request hung for minutes. Capped so a dead
      # server fails in seconds, as a 502. 4xx responses (e.g. a model that was never pulled) are not retried at all.
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    chat:
      memory:
        repository:
          jdbc:
            # Unit 9.2: JdbcChatMemoryRepository can create its table from its bundled schema-oracle.sql. Never: Flyway owns the
            # schema (V1__create_chat_memory.sql copies that table and adds a foreign key to conversation).
            initialize-schema: never
    vectorstore:
      oracle:
        # Unit 10.1: Oracle AI Vector Search, in this module's schema. The table is Flyway's (V2__create_knowledge_vector.sql, columns
        # fixed by OracleVectorStore's SQL: id, content, metadata, embedding), so the store never creates or drops it.
        initialize-schema: false
        table-name: knowledge_vector
        # Must equal the embedding model's output length and the table's vector(1024, FLOAT64) column. Changing the model means a
        # new migration and re-ingesting everything: vectors from two models are not comparable.
        dimensions: 1024
        distance-type: COSINE
        index-type: IVF
        # Normalize vectors to length 1 before storing and searching. Required for a similarity threshold (without it any
        # SearchRequest with a threshold fails at runtime), and makes COSINE and DOT rank alike.
        forced-normalization: true
    # See for details: https://docs.spring.io/spring-ai/reference/api/chat/ollama-chat.html
    ollama:
      chat:
        # Unit 7.2: the local model, only used while spring.ai.model.chat is ollama. Qwen3.5 4B (4.7B parameters) at Ollama's default
        # Q4_K_M quantization (~3.4 GB): small enough for a laptop, multilingual, supports tool calling. Always set it: left unset,
        # Spring AI silently falls back to mistral (7B, ~4 GB). Pulled by the ollama-pull compose service (7.3); keep both in sync.
        model: qwen3.5:4b
        # Qwen3.5 is a hybrid model that thinks before answering by default: measured on CPU, "say hi in 3 words" took ~1200 thinking
        # tokens and 3.5 minutes, against 7 tokens and ~2 s with thinking off. Off for plain chat.
        think: false
        # Context window in tokens (system prompt + history + reply). Its KV cache costs memory on top of the weights: ~256 MB here.
        num-ctx: 8192
      embedding:
        # Unit 10.1: Qwen3-Embedding 0.6B (Q8_0, ~640 MB, 1024 dimensions, multilingual). Picked over embeddinggemma and
        # nomic-embed-text on a catalog retrieval probe (6/6 right first hits vs 5/6 and 4/6, one question in Greek). Pulled by the
        # ollama-pull compose service; keep both in sync. Left unset, Spring AI falls back to mxbai-embed-large.
        model: qwen3-embedding:0.6b
    # See for details: https://docs.spring.io/spring-ai/reference/api/chat/anthropic-chat.html
    anthropic:
      # The key comes from the environment only, so it never appears in a committed file. The app still starts without
      # ANTHROPIC_API_KEY; a missing key surfaces on the first call (a 502 from this API). application-test.yml supplies a
      # dummy for the tests.
      api-key: ${ANTHROPIC_API_KEY}
      base-url: https://api.anthropic.com
      timeout: 60s
      max-retries: 2
      chat:
        # Claude Sonnet: the cloud model agreed for this curriculum. Only used while spring.ai.model.chat is anthropic.
        model: claude-sonnet-5
        # Upper bound on generated tokens per reply; Anthropic requires one on every request.
        max-tokens: 4096
        #        temperature: 0.7
        #        top-p: 0.9
        #        top-k: 40
        cache-options:
          strategy: SYSTEM_AND_TOOLS
          multi-block-system-caching: false
        # Geographic region where the request is processed (global, us or eu)
        inference-geo: global
  mvc:
    apiversion:
      use:
        # Spring Framework 7 API versioning: the version is path segment 1 of /api/v1/..., declared per mapping with
        # @PostMapping(version = "v1") instead of being hard-coded into the URL.
        path-segment: 1
      # Versions this API serves; any other value in the segment is rejected with a 400 ProblemDetail.
      supported: 1

# Shared defaults live here. Profile-specific overrides: application-local.yml (dev), application-test.yml
# (tests). Secrets and machine-specific values come from the environment or a git-ignored .env, never from
# a committed file.

management:
  endpoints:
    web:
      exposure:
        # Bootstrap only needs health + info. Later units add metrics, prometheus, etc. on a management port.
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      # Lets the `info:` tree below surface through the /actuator/info endpoint.
      enabled: true
    git:
      # 'full' shows branch, commit id/message/time, tags, dirty flag (from target/classes/git.properties,
      # written by the git-commit-id goal). 'simple' (default) shows only branch + short id + time.
      mode: full
    build:
      # 'build' info group, from META-INF/build-info.properties written by the spring-boot:build-info goal.
      enabled: true

# Static values exposed by /actuator/info via the env contributor. The 'build' and 'git' groups are
# contributed automatically from the files produced by the Maven build.
info:
  app:
    name: ${spring.application.name}
    description: Spring AI core training module

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: gr.codelearn.springbootai.ai

logging:
  structured:
    format:
      # Native Boot structured logging: emit console logs as Elastic Common Schema JSON, correlated with
      # traceId/spanId once tracing is wired. application-local.yml turns this off so local runs stay
      # human-readable.
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: "@project.version@"
        environment: ${spring.profiles.active:default}

# Application-owned settings, bound to validated records (config.ai.AiProperties).
app:
  ai:
    # Unit 7.4: the one switch between the cloud and the local chat model: anthropic | ollama. Feeds spring.ai.model.chat (top of
    # this file). Default: the cloud. The `local` profile switches to ollama, the `anthropic` profile back to anthropic.
    chat-provider: anthropic
    memory:
      # Unit 9.2: how many messages (user + assistant, one turn = 2) a conversation's memory keeps and sends back to the model.
      # Older ones are dropped for good, and the kept window always starts at a user message. 20 = the last 10 turns.
      max-messages: 20
    retrieval:
      # Unit 10.1 (config.ai.RetrievalProperties): how many documents retrieval hands to the model per question (the k of top-k).
      top-k: 4
      # Minimum similarity (0-1, 1 - cosine distance) for a document to count as retrieved. 0 accepts the whole top-k; 10.2 tunes it.
      similarity-threshold: 0.0
    knowledge:
      # Unit 10.1 (knowledge.KnowledgeProperties): the schema holding spring-boot-training's catalog tables, read-only (grant in
      # compose/oracle-startdb/02_ai_training_catalog_read.sql).
      catalog-schema: training
      chunking:
        # Unit 10.2: ingestion stores the bundled documents under every strategy (whole | token | markdown); this one answers.
        # Picked from POST /api/v1/knowledge/evaluations (see the README's 10.2 table).
        active: markdown
        # TokenTextSplitter's target size in tokens. Its default (800) would leave every bundled document in one piece.
        token-chunk-size: 200