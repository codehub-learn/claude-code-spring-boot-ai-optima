spring:
  application:
    name: spring-ai-training
  threads:
    virtual:
      # Java 21+ virtual threads for request handling and @Async; keeps blocking code cheap under load.
      enabled: true
  ai:
    model:
      # Unit 7.1: which provider's ChatModel bean is created. Both starters (Anthropic, Ollama) are on the classpath and each one's chat
      # autoconfig is active only when this names it; left unset, BOTH activate (matchIfMissing) and the ChatClient.Builder fails on
      # two ChatModel beans. Unit 7.4: never set it directly; it follows the validated app.ai.chat-provider (bottom of this file).
      chat: ${app.ai.chat-provider}
      # The Ollama starter also brings an EmbeddingModel. Embeddings arrive with RAG in U10; until then, none.
      embedding: none
    retry:
      # Unit 7.4: Spring AI's RetryTemplate, used by the Ollama path only (Anthropic retries inside its own SDK, see max-retries below).
      # The defaults are 10 attempts with an uncapped 2 s x5 backoff: with Ollama down a request hung for minutes. Capped so a dead
      # server fails in seconds, as a 502. 4xx responses (e.g. a model that was never pulled) are not retried at all.
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    # See for details: https://docs.spring.io/spring-ai/reference/api/chat/ollama-chat.html
    ollama:
      chat:
        # Unit 7.2: the local model, only used while spring.ai.model.chat is ollama. Qwen3.5 4B (4.7B parameters) at Ollama's default
        # Q4_K_M quantization (~3.4 GB): small enough for a laptop, multilingual, supports tool calling. Always set it: left unset,
        # Spring AI silently falls back to mistral (7B, ~4 GB). Pulled by the ollama-pull compose service (7.3); keep both in sync.
        model: qwen3.5:4b
        # Qwen3.5 is a hybrid model that thinks before answering by default: measured on CPU, "say hi in 3 words" took ~1200 thinking
        # tokens and 3.5 minutes, against 7 tokens and ~2 s with thinking off. Off for plain chat.
        think: false
        # Context window in tokens (system prompt + history + reply). Its KV cache costs memory on top of the weights: ~256 MB here.
        num-ctx: 8192
    # See for details: https://docs.spring.io/spring-ai/reference/api/chat/anthropic-chat.html
    anthropic:
      # The key comes from the environment only, so it never appears in a committed file. The app still starts without
      # ANTHROPIC_API_KEY; a missing key surfaces on the first call (a 502 from this API). application-test.yml supplies a
      # dummy for the tests.
      api-key: ${ANTHROPIC_API_KEY}
      base-url: https://api.anthropic.com
      timeout: 60s
      max-retries: 2
      chat:
        # Claude Sonnet: the cloud model agreed for this curriculum. Only used while spring.ai.model.chat is anthropic.
        model: claude-sonnet-5
        # Upper bound on generated tokens per reply; Anthropic requires one on every request.
        max-tokens: 4096
        #        temperature: 0.7
        #        top-p: 0.9
        #        top-k: 40
        cache-options:
          strategy: SYSTEM_AND_TOOLS
          multi-block-system-caching: false
        # Geographic region where the request is processed (global, us or eu)
        inference-geo: global
  mvc:
    apiversion:
      use:
        # Spring Framework 7 API versioning: the version is path segment 1 of /api/v1/..., declared per mapping with
        # @PostMapping(version = "v1") instead of being hard-coded into the URL.
        path-segment: 1
      # Versions this API serves; any other value in the segment is rejected with a 400 ProblemDetail.
      supported: 1

# Shared defaults live here. Profile-specific overrides: application-local.yml (dev), application-test.yml
# (tests). Secrets and machine-specific values come from the environment or a git-ignored .env, never from
# a committed file.

management:
  endpoints:
    web:
      exposure:
        # Bootstrap only needs health + info. Later units add metrics, prometheus, etc. on a management port.
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      # Lets the `info:` tree below surface through the /actuator/info endpoint.
      enabled: true
    git:
      # 'full' shows branch, commit id/message/time, tags, dirty flag (from target/classes/git.properties,
      # written by the git-commit-id goal). 'simple' (default) shows only branch + short id + time.
      mode: full
    build:
      # 'build' info group, from META-INF/build-info.properties written by the spring-boot:build-info goal.
      enabled: true

# Static values exposed by /actuator/info via the env contributor. The 'build' and 'git' groups are
# contributed automatically from the files produced by the Maven build.
info:
  app:
    name: ${spring.application.name}
    description: Spring AI core training module

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: gr.codelearn.springbootai.ai

logging:
  structured:
    format:
      # Native Boot structured logging: emit console logs as Elastic Common Schema JSON, correlated with
      # traceId/spanId once tracing is wired. application-local.yml turns this off so local runs stay
      # human-readable.
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: "@project.version@"
        environment: ${spring.profiles.active:default}

# Application-owned settings, bound to validated records (config.ai.AiProperties).
app:
  ai:
    # Unit 7.4: the one switch between the cloud and the local chat model: anthropic | ollama. Feeds spring.ai.model.chat (top of
    # this file). Default: the cloud. The `local` profile switches to ollama, the `anthropic` profile back to anthropic.
    chat-provider: anthropic